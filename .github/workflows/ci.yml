name: CI

# The full suite from scripts/test.sh (unit tests plus the UI screen walk on
# iPhone, iPad and Mac), the same one deploy.sh runs. TestFlight uploads stay
# local (./deploy.sh).
# Manual only: macOS minutes on this private repo are billed, so automatic runs
# on pull requests / pushes wait on Adam's decision. Start it from the Actions
# tab ("Run workflow") or with `gh workflow run ci.yml --ref <branch>`.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    # The app uses the iOS 27 SDK, which GitHub only ships on the xcode-27 image
    # (a preview as of 2026-11; macos-latest / macos-26 top out at Xcode 26.6).
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone|-- iOS'

      - name: Run tests
        run: ./scripts/test.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .build/test-results
          retention-days: 7
