name: CI

# The full suite from scripts/test.sh (unit tests plus the UI screen walk on
# iPhone, iPad and Mac), the same one deploy.sh runs. TestFlight uploads stay
# local (./deploy.sh).
# Manual only, never automatic: this is a private repo and GitHub's macOS
# minutes run out fast (Adam, 2026-11-08). The release gate is deploy.sh running
# ./scripts/test.sh on Adam's Mac. Start a run from the Actions tab ("Run
# workflow") or with `gh workflow run ci.yml --ref <branch> -f suite=full`.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "unit: BarnHubTests only (cheap). full: plus the UI screen walk on iPhone, iPad and Mac (long)."
        type: choice
        options: [unit, full]
        default: unit

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    # The app uses the iOS 27 SDK, which GitHub only ships on the xcode-27 image
    # (a preview as of 2026-11; macos-latest / macos-26 top out at Xcode 26.6).
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone|-- iOS'

      - name: Run tests
        run: |
          if [ "${{ inputs.suite }}" = "full" ]; then ./scripts/test.sh; else ./scripts/test.sh --unit; fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .build/test-results
          retention-days: 7
