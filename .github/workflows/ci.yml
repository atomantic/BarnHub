name: CI

# The full suite from scripts/test.sh (unit tests plus the UI screen walk on
# iPhone, iPad and Mac), the same one deploy.sh runs. TestFlight uploads stay
# local (./deploy.sh).
# Runs for release builds only (Adam, 2026-11-08), not on every PR, because
# macOS minutes on this private repo are billed: pushes to a release/* or
# testflight branch, version tags (v*), or by hand from the Actions tab
# ("Run workflow") / `gh workflow run ci.yml --ref <branch>`.
on:
  push:
    branches:
      - 'release/**'
      - testflight
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    # The app uses the iOS 27 SDK, which GitHub only ships on the xcode-27 image
    # (a preview as of 2026-11; macos-latest / macos-26 top out at Xcode 26.6).
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone|-- iOS'

      - name: Run tests
        run: ./scripts/test.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .build/test-results
          retention-days: 7
