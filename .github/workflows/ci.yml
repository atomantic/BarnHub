name: CI

# Build and unit tests only. TestFlight uploads stay local (./deploy.sh).
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    # The app uses the iOS 27 SDK, which GitHub only ships on the xcode-27 image
    # (a preview as of 2026-11; macos-latest / macos-26 top out at Xcode 26.6).
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone|-- iOS'

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project BarnHub.xcodeproj \
            -scheme BarnHub \
            -only-testing:BarnHubTests \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -destination-timeout 120 \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | xcbeautify
